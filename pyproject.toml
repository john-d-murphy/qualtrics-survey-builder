[project]
name = "qualtrics-survey-builder"
version = "0.1.0"
description = "YAML-driven survey builder for the Qualtrics API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.28",
    "python-docx>=1.0",
]

[project.scripts]
build-survey = "qualtrics_survey_generator:main"
survey-to-docx = "convert_yaml_to_word:main"
